<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Constellation</title>
<script src="_ltw.js"></script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0c0a08; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ---------------- tweak me ----------------
const CONFIG = {
  count: 140,            // particles per 1470x956 screen (scales with area)
  speed: 0.25,
  linkDist: 150,         // CSS px
  fps: 30,
  bg: '#0c0a08',
  dot: '#f4a27a',
  line: '#d97757',
  lineAlpha: 0.7,
  glow: true,
  glowColor: '#d97757',
};
const SCHEMA = { groups: [
  { label: 'Colors', fields: [
    { key: 'bg', type: 'color', label: 'Background' }, { key: 'dot', type: 'color', label: 'Dots' },
    { key: 'line', type: 'color', label: 'Links' }, { key: 'lineAlpha', type: 'range', label: 'Link opacity', min: 0.1, max: 1, step: 0.05 },
    { key: 'glow', type: 'toggle', label: 'Corner glow' }, { key: 'glowColor', type: 'color', label: 'Glow color' },
  ]},
  { label: 'Particles', fields: [
    { key: 'count', type: 'range', label: 'Count', min: 20, max: 400, step: 10, rebuild: true },
    { key: 'speed', type: 'range', label: 'Speed', min: 0.02, max: 2, step: 0.02, rebuild: true },
    { key: 'linkDist', type: 'range', label: 'Link distance', min: 40, max: 400, step: 5 },
  ]},
  { label: 'Performance', fields: [ { key: 'fps', type: 'range', label: 'Frame rate', min: 5, max: 60, step: 1 } ]},
]};
LTW.setup(CONFIG, SCHEMA, { rebuild: () => build(), change(k) { if (k === 'line' || k === 'glowColor') recolor(); } });
// ------------------------------------------
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d', { alpha: false });
let dpr, W, H, pts, lineRGB, glowRGB;
const rgb = (c) => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16)).join(',');
function recolor() { lineRGB = rgb(CONFIG.line); glowRGB = rgb(CONFIG.glowColor); }
function build() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  W = canvas.width = innerWidth * dpr; H = canvas.height = innerHeight * dpr;
  recolor();
  const n = Math.round(CONFIG.count * (innerWidth * innerHeight) / (1470 * 956));
  pts = Array.from({ length: n }, () => ({
    x: Math.random() * W, y: Math.random() * H,
    vx: (Math.random() - 0.5) * CONFIG.speed * dpr, vy: (Math.random() - 0.5) * CONFIG.speed * dpr,
    r: (1 + Math.random() * 1.6) * dpr, p: Math.random() * Math.PI * 2 }));
}
let last = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (now - last < 1000 / CONFIG.fps) return; last = now;
  const t = now / 1000, L = CONFIG.linkDist * dpr, L2 = L * L;
  ctx.fillStyle = CONFIG.bg; ctx.fillRect(0, 0, W, H);
  if (CONFIG.glow) {
    const g = ctx.createRadialGradient(W * 0.3, H * 0.4, 0, W * 0.3, H * 0.4, Math.max(W, H) * 0.7);
    g.addColorStop(0, `rgba(${glowRGB},0.10)`); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  for (const p of pts) {
    p.x += p.vx; p.y += p.vy;
    if (p.x < 0 || p.x > W) p.vx *= -1;
    if (p.y < 0 || p.y > H) p.vy *= -1;
  }
  ctx.lineWidth = dpr * 0.8;
  for (let i = 0; i < pts.length; i++) {
    const a = pts[i];
    for (let j = i + 1; j < pts.length; j++) {
      const b = pts[j], dx = a.x - b.x, dy = a.y - b.y, d2 = dx * dx + dy * dy;
      if (d2 > L2) continue;
      const alpha = (1 - Math.sqrt(d2) / L) * CONFIG.lineAlpha;
      ctx.strokeStyle = `rgba(${lineRGB},${alpha})`;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
  }
  ctx.fillStyle = CONFIG.dot;
  for (const p of pts) {
    ctx.globalAlpha = 0.6 + 0.4 * Math.sin(t * 1.5 + p.p);
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
build(); addEventListener('resize', build); requestAnimationFrame(frame);
</script>
</body>
</html>
