<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Nebula</title>
<script src="_ltw.js"></script>
<script src="_gl.js"></script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05060f; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ---------------- tweak me ----------------
const CONFIG = {
  colors: ['#05060f', '#1a1040', '#5a2a8a', '#d9578a', '#ffd9a0'],   // space, deep, cloud, glow, star-hot
  density: 0.9,        // how much of the sky the clouds fill
  stars: 1.0,
  twinkle: 0.6,
  speed: 0.08,
  parallax: 0.04,      // mouse parallax strength
  resolution: 0.5,
  fps: 30,
};
const SCHEMA = { pointer: true, groups: [
  { label: 'Colors', fields: [ { key: 'colors', type: 'colors', label: 'Space → stars' } ]},
  { label: 'Sky', fields: [
    { key: 'density', type: 'range', label: 'Cloud density', min: 0.2, max: 1.6, step: 0.05 },
    { key: 'stars', type: 'range', label: 'Stars', min: 0, max: 2, step: 0.05 },
    { key: 'twinkle', type: 'range', label: 'Twinkle', min: 0, max: 1, step: 0.05 },
  ]},
  { label: 'Motion', fields: [
    { key: 'speed', type: 'range', label: 'Drift', min: 0, max: 0.4, step: 0.01 },
    { key: 'parallax', type: 'range', label: 'Mouse parallax', min: 0, max: 0.15, step: 0.005 },
  ]},
  { label: 'Performance', fields: [
    { key: 'resolution', type: 'range', label: 'Render scale', min: 0.2, max: 1, step: 0.05 },
    { key: 'fps', type: 'range', label: 'Frame rate', min: 5, max: 60, step: 1 },
  ]},
]};
LTW.setup(CONFIG, SCHEMA, { change(k) { if (k === 'resolution') G.resize(CONFIG.resolution); else setUniforms(); } });
// ------------------------------------------
const FS = `
uniform float T, D, S, TW; uniform vec2 P; uniform vec3 C0, C1, C2, C3, C4;
float h(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float n(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
  return mix(mix(h(i), h(i+vec2(1,0)), f.x), mix(h(i+vec2(0,1)), h(i+vec2(1,1)), f.x), f.y); }
float fbm(vec2 p){ float v = 0.0, a = 0.5; mat2 m = mat2(1.7, 1.1, -1.1, 1.7);
  for (int i = 0; i < 6; i++) { v += a * n(p); p = m * p + 0.3; a *= 0.5; } return v; }
float stars(vec2 uv, float scale, float t) {
  vec2 g = uv * scale; vec2 id = floor(g), f = fract(g) - 0.5;
  float r = h(id); if (r < 0.9) return 0.0;
  vec2 off = vec2(h(id + 1.7), h(id + 3.1)) - 0.5;
  float d = length(f - off * 0.6);
  float tw = 0.6 + 0.4 * sin(t * (2.0 + 4.0 * h(id + 9.0)) + r * 40.0);
  return smoothstep(0.08, 0.0, d) * mix(1.0, tw, TW) * (r - 0.9) * 10.0;
}
void main(){
  vec2 uv = gl_FragCoord.xy / R; float asp = R.x / R.y;
  vec2 p = (uv - 0.5) * vec2(asp, 1.0);
  vec2 par = P * 0.5;
  // three cloud layers at different depths; deeper layers move less with the mouse
  vec2 q1 = p * 1.3 + par * 0.4 + vec2(T * 0.10, T * 0.03);
  vec2 q2 = p * 2.2 + par * 0.8 + vec2(-T * 0.06, T * 0.05) + 3.7;
  float w = fbm(q1 + 0.6 * vec2(fbm(q1 + T * 0.05), fbm(q1 - 2.0)));
  float w2 = fbm(q2 + 0.4 * vec2(fbm(q2 * 1.3), fbm(q2 + 5.0)));
  float cloud = smoothstep(0.55 - 0.25 * D, 0.95, w * 0.7 + w2 * 0.45);
  float wisps = pow(w2, 3.0) * 1.5;
  vec3 col = C0;
  col = mix(col, C1, smoothstep(0.15, 0.7, w) * 0.9);
  col = mix(col, C2, cloud);
  col = mix(col, C3, pow(cloud, 2.5) * (0.5 + 0.5 * w2));
  col += C4 * wisps * 0.25 * cloud;
  // stars: two scales, farther one with less parallax
  float s = stars(p + par * 0.15, 28.0, T * 3.0) * 0.8 + stars(p + par * 0.35 + 4.2, 60.0, T * 3.0) * 0.5;
  col += C4 * s * S * (1.0 - cloud * 0.7);
  col *= 0.8 + 0.4 * (1.0 - length(uv - 0.5) * 0.9);
  col += (h(gl_FragCoord.xy + fract(T)) - 0.5) * 0.02;
  gl_FragColor = vec4(col, 1.0);
}`;
const G = GL(document.getElementById('c'), FS);
function setUniforms() {
  G.colors('C', CONFIG.colors, 5);
  G.uniform('D', CONFIG.density); G.uniform('S', CONFIG.stars); G.uniform('TW', CONFIG.twinkle);
}
setUniforms(); G.resize(CONFIG.resolution); addEventListener('resize', () => G.resize(CONFIG.resolution));
let t = 0, px = 0, py = 0;
LTWLoop(() => CONFIG.fps, (now, dt) => {
  t += dt * CONFIG.speed;
  px += (LTW.pointer.x * CONFIG.parallax * 5 - px) * 0.08;   // ease toward the mouse
  py += (LTW.pointer.y * CONFIG.parallax * 5 - py) * 0.08;
  G.uniform('T', t); G.uniform('P', px, py); G.draw();
});
</script>
</body>
</html>
