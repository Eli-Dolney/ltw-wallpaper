<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Liquid</title>
<script src="_ltw.js"></script>
<script src="_gl.js"></script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0b12; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ---------------- tweak me ----------------
const CONFIG = {
  colors: ['#0b0b12', '#2a1f5e', '#d97757', '#f6d58a'],   // dark, deep, warm, highlight
  scale: 1.2, warp: 1.0, speed: 0.25, contrast: 1.0, sheen: 0.5,
  audio: true,          // bass swells the blobs
  resolution: 0.5, fps: 30,
};
const SCHEMA = { audio: true, groups: [
  { label: 'Colors', fields: [ { key: 'colors', type: 'colors', label: 'Dark → highlight' } ]},
  { label: 'Fluid', fields: [
    { key: 'scale', type: 'range', label: 'Blob size', min: 0.4, max: 3, step: 0.05 },
    { key: 'warp', type: 'range', label: 'Swirl', min: 0, max: 2.5, step: 0.05 },
    { key: 'contrast', type: 'range', label: 'Contrast', min: 0.5, max: 2, step: 0.05 },
    { key: 'sheen', type: 'range', label: 'Sheen', min: 0, max: 1, step: 0.05 },
  ]},
  { label: 'Motion', fields: [
    { key: 'speed', type: 'range', label: 'Speed', min: 0, max: 1, step: 0.01 },
    { key: 'audio', type: 'toggle', label: 'React to music ♪' },
  ]},
  { label: 'Performance', fields: [
    { key: 'resolution', type: 'range', label: 'Render scale', min: 0.2, max: 1, step: 0.05 },
    { key: 'fps', type: 'range', label: 'Frame rate', min: 5, max: 60, step: 1 },
  ]},
]};
LTW.setup(CONFIG, SCHEMA, { change(k) { if (k === 'resolution') G.resize(CONFIG.resolution); else setUniforms(); } });
// ------------------------------------------
const FS = `
uniform float T, SC, WA, CO, SH, B, M; uniform vec3 C0, C1, C2, C3;
void main(){
  vec2 uv = gl_FragCoord.xy / R; float asp = R.x / R.y;
  vec2 p = (uv - 0.5) * vec2(asp, 1.0) * (3.0 / SC);
  float t = T;
  // layered sine domain warping: the classic "plasma", but slow and smooth
  for (int i = 1; i < 6; i++) {
    float fi = float(i);
    vec2 q = p;
    p.x += (WA * 0.35 + B * 0.25) / fi * sin(fi * q.y * 1.3 + t * (0.7 + 0.1 * fi) + fi * 1.7) ;
    p.y += (WA * 0.35 + B * 0.25) / fi * cos(fi * q.x * 1.1 + t * (0.5 + 0.13 * fi) + fi * 0.9);
  }
  float v = 0.5 + 0.5 * sin(p.x * 1.2 + p.y * 0.8 + t * 0.4);
  float w = 0.5 + 0.5 * cos(length(p) * 1.5 - t * 0.6);
  float f = pow(mix(v, w, 0.5), CO);
  vec3 col = mix(C0, C1, smoothstep(0.0, 0.45, f));
  col = mix(col, C2, smoothstep(0.4, 0.8, f));
  col = mix(col, C3, smoothstep(0.78, 1.0, f) * (0.7 + 0.6 * M));
  // sheen: fake specular from the gradient of the field
  float dx = sin(p.x * 1.2 + p.y * 0.8 + t * 0.4 + 0.05) - sin(p.x * 1.2 + p.y * 0.8 + t * 0.4);
  col += vec3(1.0, 0.95, 0.9) * SH * 0.35 * smoothstep(0.02, 0.06, dx) * smoothstep(0.5, 0.9, f);
  col *= 0.85 + 0.3 * (1.0 - length(uv - 0.5));
  gl_FragColor = vec4(col, 1.0);
}`;
const G = GL(document.getElementById('c'), FS);
function setUniforms() {
  G.colors('C', CONFIG.colors, 4);
  G.uniform('SC', CONFIG.scale); G.uniform('WA', CONFIG.warp); G.uniform('CO', CONFIG.contrast); G.uniform('SH', CONFIG.sheen);
}
setUniforms(); G.resize(CONFIG.resolution); addEventListener('resize', () => G.resize(CONFIG.resolution));
let t = 0, bass = 0, mid = 0;
LTWLoop(() => CONFIG.fps, (now, dt) => {
  LTW.audioTick(now);
  const tb = CONFIG.audio ? LTW.audio.bass : 0, tm = CONFIG.audio ? LTW.audio.mid : 0;
  bass += (tb - bass) * (tb > bass ? 0.4 : 0.08); mid += (tm - mid) * 0.1;
  t += dt * CONFIG.speed * (1 + bass * 0.8);
  G.uniform('T', t); G.uniform('B', bass); G.uniform('M', mid); G.draw();
});
</script>
</body>
</html>
