<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Fireflies</title>
<script src="_ltw.js"></script>
<script src="_gl.js"></script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #050a08; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ---------------- tweak me ----------------
const CONFIG = {
  bgTop: '#050a08', bgBottom: '#0d1f16', fly: '#e8ff9a', fly2: '#ffc46b',
  count: 90, size: 1.0, speed: 0.6, glow: 1.0, bokeh: 0.6, attract: 0.5,
  grass: true, fps: 30,
};
const SCHEMA = { pointer: true, groups: [
  { label: 'Colors', fields: [
    { key: 'bgTop', type: 'color', label: 'Sky' }, { key: 'bgBottom', type: 'color', label: 'Ground' },
    { key: 'fly', type: 'color', label: 'Fireflies' }, { key: 'fly2', type: 'color', label: 'Warm ones' },
  ]},
  { label: 'Fireflies', fields: [
    { key: 'count', type: 'range', label: 'Count', min: 10, max: 300, step: 5, rebuild: true },
    { key: 'size', type: 'range', label: 'Size', min: 0.4, max: 3, step: 0.1, rebuild: true },
    { key: 'glow', type: 'range', label: 'Glow', min: 0, max: 2, step: 0.05, rebuild: true },
    { key: 'bokeh', type: 'range', label: 'Out-of-focus ones', min: 0, max: 1, step: 0.05, rebuild: true },
    { key: 'grass', type: 'toggle', label: 'Grass silhouette', rebuild: true },
  ]},
  { label: 'Motion', fields: [
    { key: 'speed', type: 'range', label: 'Speed', min: 0.05, max: 2, step: 0.05 },
    { key: 'attract', type: 'range', label: 'Follow the mouse', min: 0, max: 1, step: 0.05 },
  ]},
  { label: 'Performance', fields: [ { key: 'fps', type: 'range', label: 'Frame rate', min: 5, max: 60, step: 1 } ]},
]};
LTW.setup(CONFIG, SCHEMA, { rebuild: () => build() });
// ------------------------------------------
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d', { alpha: false });
let dpr, W, H, flies = [], sprites = [], grass = null;
function sprite(color, r, soft) {
  const c = document.createElement('canvas'); c.width = c.height = Math.ceil(r * 2) + 2;
  const g = c.getContext('2d'), m = c.width / 2;
  const grad = g.createRadialGradient(m, m, 0, m, m, r);
  grad.addColorStop(0, color); grad.addColorStop(soft ? 0.15 : 0.35, color + 'cc'); grad.addColorStop(1, color + '00');
  g.fillStyle = grad; g.fillRect(0, 0, c.width, c.height);
  return c;
}
function build() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  W = canvas.width = innerWidth * dpr; H = canvas.height = innerHeight * dpr;
  const base = 3 * CONFIG.size * dpr;
  sprites = [
    sprite(CONFIG.fly, base * (1.5 + CONFIG.glow * 2.5), false), sprite(CONFIG.fly2, base * (1.5 + CONFIG.glow * 2.5), false),
    sprite(CONFIG.fly, base * (6 + CONFIG.glow * 6), true), sprite(CONFIG.fly2, base * (6 + CONFIG.glow * 6), true),   // bokeh
  ];
  const n = Math.round(CONFIG.count * (innerWidth * innerHeight) / (1470 * 956));
  flies = Array.from({ length: n }, () => {
    const bokeh = Math.random() < CONFIG.bokeh * 0.35;
    return { x: Math.random() * W, y: H * (0.25 + Math.random() * 0.75), vx: 0, vy: 0, a: Math.random() * Math.PI * 2,
             warm: Math.random() < 0.3, bokeh, phase: Math.random() * 10, rate: 0.6 + Math.random() * 1.4, depth: bokeh ? 0.4 : 0.6 + Math.random() * 0.4 };
  });
  // grass silhouette drawn once
  grass = null;
  if (CONFIG.grass) {
    grass = document.createElement('canvas'); grass.width = W; grass.height = H;
    const g = grass.getContext('2d');
    g.fillStyle = '#000';
    for (let layer = 0; layer < 2; layer++) {
      const baseY = H * (0.9 + layer * 0.06), hgt = H * (0.09 - layer * 0.03);
      for (let x = -20; x < W + 20; x += 3 * dpr) {
        const h = hgt * (0.4 + Math.random() * 0.6), lean = (Math.random() - 0.5) * 20 * dpr;
        g.beginPath(); g.moveTo(x, baseY); g.quadraticCurveTo(x + lean * 0.5, baseY - h * 0.6, x + lean, baseY - h);
        g.lineWidth = (1 + Math.random()) * dpr; g.strokeStyle = layer ? '#000' : '#02050399'; g.stroke();
      }
      g.fillRect(0, baseY, W, H - baseY);
    }
  }
}
build(); addEventListener('resize', build);
let t = 0, mx = 0, my = 0;
LTWLoop(() => CONFIG.fps, (now, dt) => {
  t += dt;
  mx += (LTW.pointer.x - mx) * 0.1; my += (LTW.pointer.y - my) * 0.1;
  const tx = W * (0.5 + mx * 0.5), ty = H * (0.5 - my * 0.5);
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, CONFIG.bgTop); grad.addColorStop(1, CONFIG.bgBottom);
  ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';
  const sp = CONFIG.speed * 40 * dpr;
  for (const f of flies) {
    f.a += (Math.random() - 0.5) * 1.2 * dt * 3;
    let ax = Math.cos(f.a) * sp, ay = Math.sin(f.a) * sp * 0.6;
    if (CONFIG.attract > 0 && LTW.pointer.live) {
      const dx = tx - f.x, dy = ty - f.y, d = Math.hypot(dx, dy) + 1;
      const pull = CONFIG.attract * 60 * dpr * Math.min(1, 400 * dpr / d);
      ax += dx / d * pull; ay += dy / d * pull;
    }
    f.vx += (ax - f.vx) * dt * 1.5; f.vy += (ay - f.vy) * dt * 1.5;
    f.x += f.vx * dt * f.depth; f.y += f.vy * dt * f.depth;
    if (f.x < -40) f.x = W + 40; if (f.x > W + 40) f.x = -40;
    if (f.y < H * 0.1) f.vy += 20 * dpr * dt; if (f.y > H * 0.95) f.vy -= 40 * dpr * dt;
    const pulse = Math.max(0, Math.sin(t * f.rate + f.phase));
    const bright = Math.pow(pulse, 3) * (f.bokeh ? 0.35 : 1);
    if (bright < 0.02) continue;
    const s = sprites[(f.bokeh ? 2 : 0) + (f.warm ? 1 : 0)];
    ctx.globalAlpha = bright;
    ctx.drawImage(s, f.x - s.width / 2, f.y - s.height / 2);
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  if (grass) ctx.drawImage(grass, 0, 0);
});
</script>
</body>
</html>
