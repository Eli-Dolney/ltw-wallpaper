<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Topo</title>
<script src="_ltw.js"></script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d10; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ---------------- tweak me ----------------
// Contour lines of drifting noise, computed on the GPU.
const CONFIG = {
  levels: 14,            // number of contour lines
  zoom: 1.6,             // terrain feature size (bigger = more, smaller features)
  speed: 0.05,
  fps: 20,
  resolution: 0.6,       // render scale
  bg: '#0b0d10',
  line: '#d97757',
  lineWidth: 1.0,        // px at 1x
  lineAlpha: 0.4,
  accentEvery: 4,        // every Nth line is brighter and thicker
};
const SCHEMA = { groups: [
  { label: 'Colors', fields: [
    { key: 'bg', type: 'color', label: 'Background' }, { key: 'line', type: 'color', label: 'Lines' },
    { key: 'lineAlpha', type: 'range', label: 'Line opacity', min: 0.05, max: 1, step: 0.05 },
  ]},
  { label: 'Terrain', fields: [
    { key: 'levels', type: 'range', label: 'Contour lines', min: 3, max: 40, step: 1 },
    { key: 'zoom', type: 'range', label: 'Detail', min: 0.3, max: 6, step: 0.1 },
    { key: 'lineWidth', type: 'range', label: 'Line width', min: 0.5, max: 4, step: 0.1 },
    { key: 'accentEvery', type: 'range', label: 'Accent every', min: 1, max: 10, step: 1 },
    { key: 'speed', type: 'range', label: 'Speed', min: 0, max: 0.3, step: 0.005 },
  ]},
  { label: 'Performance', fields: [
    { key: 'resolution', type: 'range', label: 'Render scale', min: 0.2, max: 1, step: 0.05 },
    { key: 'fps', type: 'range', label: 'Frame rate', min: 5, max: 60, step: 1 },
  ]},
]};
LTW.setup(CONFIG, SCHEMA, { change(k) { if (k === 'resolution') resize(); } });
// ------------------------------------------
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl', { antialias: false, alpha: false, powerPreference: 'low-power' });
const VS = `attribute vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }`;
const FS = `
#extension GL_OES_standard_derivatives : enable
precision highp float;
uniform vec2 R; uniform float T, LEVELS, ZOOM, WIDTH, ALPHA, ACCENT, SCALE;
uniform vec3 BG, LINE;
vec3 h3(vec3 p){ p = fract(p * vec3(0.1031, 0.1030, 0.0973)); p += dot(p, p.yxz + 33.33); return fract((p.xxy + p.yxx) * p.zyx); }
float h(vec3 p){ return h3(p).x; }
float n3(vec3 p){
  vec3 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
  return mix(mix(mix(h(i), h(i+vec3(1,0,0)), f.x), mix(h(i+vec3(0,1,0)), h(i+vec3(1,1,0)), f.x), f.y),
             mix(mix(h(i+vec3(0,0,1)), h(i+vec3(1,0,1)), f.x), mix(h(i+vec3(0,1,1)), h(i+vec3(1,1,1)), f.x), f.y), f.z);
}
float fbm(vec3 p){ return n3(p) * 0.55 + n3(p * 2.0 + 5.0) * 0.3 + n3(p * 4.0 + 1.0) * 0.15; }
void main(){
  vec2 uv = gl_FragCoord.xy / R;
  vec2 p = uv * vec2(R.x / R.y, 1.0) * ZOOM;
  float f = fbm(vec3(p, T)) * LEVELS;
  float g = fwidth(f);                             // how fast f changes per pixel
  float d = abs(fract(f) - 0.5);                   // distance to the nearest contour, in level units
  float idx = floor(f + 0.5);
  float accent = step(0.5, 1.0 - abs(mod(idx, ACCENT)));   // 1 on every ACCENT-th line
  float w = WIDTH * SCALE * (1.0 + 0.8 * accent) * g;       // line half-width in level units
  float line = 1.0 - smoothstep(w, w + g, d);
  float a = ALPHA * (accent > 0.5 ? 2.2 : 1.0);
  vec3 col = mix(BG, LINE, clamp(line * a, 0.0, 1.0));
  gl_FragColor = vec4(col, 1.0);
}`;
gl.getExtension('OES_standard_derivatives');
function sh(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog); gl.useProgram(prog);
const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const U = (n) => gl.getUniformLocation(prog, n);
const hex = (c) => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16) / 255);
let scale = 1;
function resize() {
  scale = Math.min(devicePixelRatio || 1, 2) * CONFIG.resolution;
  canvas.width = Math.max(1, Math.floor(innerWidth * scale)); canvas.height = Math.max(1, Math.floor(innerHeight * scale));
  gl.viewport(0, 0, canvas.width, canvas.height); gl.uniform2f(U('R'), canvas.width, canvas.height);
}
resize(); addEventListener('resize', resize);
let last = 0, tAcc = 0, lastT = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  if (now - last < 1000 / CONFIG.fps) return; last = now;
  tAcc += (now - lastT) / 1000 * CONFIG.speed; lastT = now;
  gl.uniform1f(U('T'), tAcc); gl.uniform1f(U('LEVELS'), CONFIG.levels); gl.uniform1f(U('ZOOM'), CONFIG.zoom);
  gl.uniform1f(U('WIDTH'), CONFIG.lineWidth); gl.uniform1f(U('ALPHA'), CONFIG.lineAlpha);
  gl.uniform1f(U('ACCENT'), Math.max(1, CONFIG.accentEvery)); gl.uniform1f(U('SCALE'), scale);
  gl.uniform3fv(U('BG'), hex(CONFIG.bg)); gl.uniform3fv(U('LINE'), hex(CONFIG.line));
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
