<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Monitor</title>
<script src="_ltw.js"></script>
<script src="_gl.js"></script>
<script src="_bg.js"></script>
<style>
  :root { --fg: #eef1f6; --accent: #d97757; --warn: #ff6b5b; --amber: #ffb648; --good: #5fd48a; --scale: 1; --pop: 0.35; --radius: 18px;
          --margin: 56px; --dim: 0.2; --cols: 3; --font: -apple-system, "Helvetica Neue", sans-serif; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: var(--fg); font-family: var(--font);
               -webkit-font-smoothing: antialiased; }
  #bgwrap, #bgwrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #dim { position: absolute; inset: 0; background: #000; opacity: var(--dim); pointer-events: none; }
  #scan { position: absolute; inset: 0; pointer-events: none; display: none;
          background: repeating-linear-gradient(0deg, rgba(0,0,0,0.28) 0 1px, transparent 1px 3px); }
  .scanlines #scan { display: block; }

  /* ---- layout ---- */
  #dash { position: absolute; inset: 0; padding: var(--margin); box-sizing: border-box; display: flex;
          font-size: calc(var(--scale) * var(--fit, 1) * min(1vw, 1.78vh)); font-variant-numeric: tabular-nums; --tw: 18em; --th: 12.5em; }
  .l-grid { align-items: center; justify-content: center; }
  .l-sidebar-left { align-items: flex-start; justify-content: flex-start; }
  .l-sidebar-right { align-items: flex-start; justify-content: flex-end; }
  .l-bar-top { align-items: flex-start; justify-content: center; }
  .l-bar-bottom { align-items: flex-end; justify-content: center; }
  .l-corner.c-top-left { align-items: flex-start; justify-content: flex-start; }
  .l-corner.c-top-right { align-items: flex-start; justify-content: flex-end; }
  .l-corner.c-bottom-left { align-items: flex-end; justify-content: flex-start; }
  .l-corner.c-bottom-right { align-items: flex-end; justify-content: flex-end; }
  .tiles { display: grid; gap: 1em; flex: none; }
  .l-grid .tiles { grid-template-columns: repeat(var(--cols), var(--tw)); grid-auto-rows: minmax(var(--th), auto); grid-auto-flow: dense; }
  .l-grid .tile.wide { grid-column: span 2; }
  .l-sidebar-left, .l-sidebar-right { padding-top: calc(var(--margin) * 0.6); padding-bottom: calc(var(--margin) * 0.6); }
  .l-sidebar-left .tiles, .l-sidebar-right .tiles { grid-template-columns: var(--tw); gap: 0.45em; }
  .l-sidebar-left .tile, .l-sidebar-right .tile { padding: 0.7em 0.9em; gap: 0.4em; }
  .l-sidebar-left .cpu-top .ring, .l-sidebar-right .cpu-top .ring { width: 5.4em; height: 5.4em; }
  .l-sidebar-left .gpu .ring, .l-sidebar-right .gpu .ring, .l-sidebar-left .bat .ring, .l-sidebar-right .bat .ring { width: 4.6em; height: 4.6em; }
  .l-sidebar-left .gpu .rv, .l-sidebar-right .gpu .rv, .l-sidebar-left .bat .rv, .l-sidebar-right .bat .rv { font-size: 1.3em; }
  .l-sidebar-left .kv.rows, .l-sidebar-right .kv.rows { gap: 0.25em; }
  .l-sidebar-left .kv.rows .mid, .l-sidebar-right .kv.rows .mid { font-size: 1.05em; }
  .l-sidebar-left .cores, .l-sidebar-right .cores { height: 1.6em; }
  .compact .tiles { display: flex; gap: 0; padding: 0.25em 0.5em; }
  .l-bar-top .tiles, .l-bar-bottom .tiles { flex-direction: row; align-items: stretch; }
  .l-corner .tiles { flex-direction: column; min-width: var(--tw); padding: 0.4em 1.1em; }

  /* ---- panels / styles ---- */
  .panel { border-radius: var(--radius); }
  .s-glass .panel { background: rgba(12, 14, 22, var(--pop)); -webkit-backdrop-filter: blur(28px) saturate(1.4); backdrop-filter: blur(28px) saturate(1.4);
                    border: 1px solid rgba(255,255,255,0.13); box-shadow: inset 0 1px 0 rgba(255,255,255,0.09), 0 14px 44px rgba(0,0,0,0.3); }
  .s-flat .panel { background: rgba(15, 16, 21, calc(0.65 + var(--pop) * 0.35)); border: 1px solid rgba(255,255,255,0.06); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
  .s-outline .panel { background: rgba(0, 0, 0, calc(var(--pop) * 0.45)); border: 1px solid color-mix(in srgb, var(--accent) 60%, transparent); }
  .s-outline { text-shadow: 0 1px 12px rgba(0,0,0,0.75), 0 0 2px rgba(0,0,0,0.6); }
  .s-outline .th { opacity: 0.85; color: var(--accent); }
  .s-terminal { font-family: ui-monospace, "SF Mono", Menlo, monospace !important; text-shadow: 0 0 7px color-mix(in srgb, var(--fg) 45%, transparent); }
  .s-terminal .panel { background: rgba(0, 5, 2, calc(0.35 + var(--pop) * 0.6)); border: 1px solid color-mix(in srgb, var(--accent) 50%, transparent);
                       border-radius: min(var(--radius), 6px); box-shadow: inset 0 0 50px rgba(0,0,0,0.45), 0 0 26px color-mix(in srgb, var(--accent) 14%, transparent); }
  .s-terminal .th { opacity: 0.9; color: var(--accent); letter-spacing: 0.1em; }
  .s-terminal .th > span:first-child::before { content: '> '; }
  .s-terminal .big, .s-terminal .mid { font-weight: 500; letter-spacing: 0; }
  .s-terminal .track { stroke-opacity: 0.2; }

  /* ---- tiles ---- */
  .tile { position: relative; display: flex; flex-direction: column; gap: 0.7em; padding: 1em 1.15em; box-sizing: border-box; min-width: 0; overflow: hidden; }
  .l-grid .tile { min-height: var(--th); }
  .th { display: flex; align-items: center; justify-content: space-between; gap: 0.8em; font-size: 0.72em; letter-spacing: 0.16em; text-transform: uppercase;
        opacity: 0.62; font-weight: 500; white-space: nowrap; }
  .notitles .th { display: none; }
  .big { font-size: 2.1em; font-weight: 300; letter-spacing: -0.02em; line-height: 1; white-space: nowrap; }
  .mid { font-size: 1.45em; font-weight: 400; letter-spacing: -0.01em; line-height: 1.1; white-space: nowrap; }
  .sm { font-size: 0.8em; opacity: 0.75; white-space: nowrap; }
  .xs { font-size: 0.7em; opacity: 0.55; letter-spacing: 0.04em; white-space: nowrap; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 1em; min-width: 0; }
  .gap { gap: 1.2em; } .fill { flex: 1; min-height: 0; min-width: 0; }
  .graph { display: block; width: 100%; flex: 1; min-height: 4.5em; }
  .l-sidebar-left .graph, .l-sidebar-right .graph { flex: none; height: 3em; min-height: 0; }
  b { font-weight: 500; }
  .warn { color: var(--warn) !important; } .amber { color: var(--amber) !important; } .good { color: var(--good) !important; }

  /* rings */
  .ring { position: relative; width: 7.2em; height: 7.2em; flex: none; }
  .ring svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .track { fill: none; stroke: var(--fg); stroke-opacity: 0.12; stroke-width: 7; stroke-linecap: round; }
  .prog { fill: none; stroke: var(--accent); stroke-width: 7; stroke-linecap: round; }
  .rc { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .rv { font-size: 1.85em; font-weight: 300; letter-spacing: -0.02em; line-height: 1; white-space: nowrap; }
  .rs { font-size: 0.6em; letter-spacing: 0.16em; text-transform: uppercase; opacity: 0.55; margin-top: 0.5em; white-space: nowrap; }
  .alert .prog { stroke: var(--warn); } .alert .rv, .alert .used { color: var(--warn); }

  /* cpu */
  .cpu-body { display: flex; gap: 1.3em; flex: 1; min-height: 0; align-items: stretch; }
  .cpu-right { flex: 1; display: flex; flex-direction: column; gap: 0.7em; min-width: 0; }
  .cpu-top { display: flex; align-items: center; gap: 1.2em; }
  .cpu-top .kv { flex: 1; }
  .cores { display: flex; gap: 0.22em; height: 2.2em; align-items: flex-end; }
  .core { flex: 1; height: 100%; background: color-mix(in srgb, var(--fg) 10%, transparent); border-radius: 0.18em; position: relative; overflow: hidden; }
  .core i { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: var(--accent); border-radius: 0.18em; }
  .core i.hot { background: var(--warn); }
  .meta { font-size: 0.78em; opacity: 0.8; }
  .meta b { opacity: 1; }
  .badge { display: none; font-size: 0.85em; padding: 0.15em 0.55em; border-radius: 0.5em; background: var(--amber); color: #111; letter-spacing: 0.1em; font-weight: 600; text-shadow: none; }
  .badge.on { display: inline-block; } .badge.crit { background: var(--warn); }
  .pulse { animation: glow 2.2s ease-in-out infinite; }
  @keyframes glow { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }

  /* bars */
  .bar { flex: 1; height: 0.5em; background: color-mix(in srgb, var(--fg) 10%, transparent); border-radius: 0.3em; overflow: hidden; position: relative; min-width: 2em; }
  .bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--accent); border-radius: 0.3em; }
  .stack { display: flex; height: 1.15em; border-radius: 0.4em; overflow: hidden; background: color-mix(in srgb, var(--fg) 9%, transparent); gap: 2px; }
  .stack i { display: block; height: 100%; width: 0; flex: none; }
  .c-app { background: var(--accent); } .c-wired { background: color-mix(in srgb, var(--accent) 65%, var(--fg) 20%); }
  .c-comp { background: color-mix(in srgb, var(--accent) 35%, transparent); } .c-cache { background: color-mix(in srgb, var(--fg) 28%, transparent); }
  .alert .stack i { filter: saturate(0) brightness(1.3); } .alert .stack i.c-app { background: var(--warn); filter: none; }
  .legend { display: grid; grid-template-columns: auto auto auto auto; justify-content: space-between; gap: 0.6em; }
  .legend span { display: flex; flex-direction: column; gap: 0.2em; min-width: 0; }
  .legend em { font-style: normal; opacity: 0.6; font-size: 0.66em; letter-spacing: 0.04em; display: flex; align-items: center; gap: 0.4em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .legend b { font-size: 0.85em; white-space: nowrap; }
  .s-terminal .legend em { font-size: 0.6em; letter-spacing: 0; }
  .dot { width: 0.7em; height: 0.7em; border-radius: 50%; flex: none; }
  .mem-head { display: flex; align-items: baseline; gap: 0.5em; flex-wrap: wrap; }
  .mem-head .pressure { margin-left: auto; }

  /* key-values */
  .kv { display: grid; grid-template-columns: 1fr 1fr; gap: 0.7em 1.2em; min-width: 0; }
  .kv > div { display: flex; flex-direction: column; gap: 0.2em; min-width: 0; }
  .kv .xs { opacity: 0.55; } .kv .mid { font-size: 1.25em; overflow: hidden; text-overflow: ellipsis; }
  .kv.one { grid-template-columns: 1fr; gap: 0.45em; }
  .kv.one .mid { font-size: 1.05em; }
  .kv.rows { grid-template-columns: 1fr; gap: 0.5em; align-content: center; }
  .kv.rows > div { flex-direction: row; justify-content: space-between; align-items: baseline; gap: 0.6em; }
  .kv.rows .mid { font-size: 1.15em; flex: none; overflow: visible; }
  .kv.rows .xs { opacity: 0.6; overflow: hidden; text-overflow: ellipsis; }
  .bat .ring { width: 6.4em; height: 6.4em; }
  .speeds { display: flex; gap: 2em; }
  .speeds > div { display: flex; flex-direction: column; gap: 0.25em; min-width: 0; }
  .arrow { opacity: 0.55; font-weight: 400; margin-right: 0.15em; }

  /* processes */
  .plist { display: flex; flex-direction: column; gap: 0.45em; flex: 1; justify-content: center; }
  .prow { display: grid; grid-template-columns: minmax(0, 7.5em) 1fr 3.2em 4.4em; align-items: center; gap: 0.7em; font-size: 0.82em; }
  .prow .pn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .prow .pc { text-align: right; font-weight: 500; } .prow .pm { text-align: right; opacity: 0.6; }

  /* compact chips (bar / corner) */
  .chip { position: relative; display: flex; align-items: center; gap: 0.7em; padding: 0.45em 1em; min-width: 0; border-radius: 0.6em; }
  .l-bar-top .chip + .chip, .l-bar-bottom .chip + .chip { border-left: 1px solid color-mix(in srgb, var(--fg) 13%, transparent); }
  .l-corner .chip { padding: 0.6em 0.1em; }
  .l-corner .chip + .chip { border-top: 1px solid color-mix(in srgb, var(--fg) 13%, transparent); }
  .l-corner .chip .spark, .l-corner .chip .bar { margin-left: auto; }
  .chip .ring { width: 2.7em; height: 2.7em; }
  .chip .track, .chip .prog { stroke-width: 10; }
  .chip .rv { font-size: 0.66em; font-weight: 600; letter-spacing: 0; }
  .chip .txt { display: flex; flex-direction: column; gap: 0.15em; min-width: 0; flex: none; }
  .chip .lab { font-size: 0.68em; letter-spacing: 0.16em; text-transform: uppercase; opacity: 0.55; font-weight: 500; white-space: nowrap; }
  .chip .val { font-size: 1.05em; font-weight: 500; white-space: nowrap; line-height: 1.1; }
  .chip .val small { font-weight: 400; opacity: 0.6; font-size: 0.8em; }
  .chip .spark { display: block; width: 7em; height: 2.1em; flex: none; }
  .l-corner .chip .spark { width: 5.5em; }
  .chip .bar { width: 6em; flex: none; margin-top: 0.1em; }
  .chip .battglyph { width: 2.2em; height: 1.1em; border: 1.5px solid color-mix(in srgb, var(--fg) 60%, transparent); border-radius: 0.25em; position: relative; flex: none; }
  .chip .battglyph::after { content: ''; position: absolute; right: -0.3em; top: 0.28em; width: 0.17em; height: 0.5em; background: color-mix(in srgb, var(--fg) 60%, transparent); border-radius: 0 0.1em 0.1em 0; }
  .chip .battglyph i { position: absolute; left: 2px; top: 2px; bottom: 2px; width: 0; background: var(--accent); border-radius: 0.12em; }
  .chip.alert .val { color: var(--warn); }
  .s-terminal .chip .lab { color: var(--accent); opacity: 0.9; }

  /* alerts */
  .tile.alert::after, .chip.alert::after { content: ''; position: absolute; inset: 0; border-radius: inherit; border: 1.5px solid var(--warn);
                                           pointer-events: none; animation: pulse 2.2s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 0.12; } 50% { opacity: 0.85; } }
  #empty { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; font-size: 14px; letter-spacing: 0.3em; text-transform: uppercase; opacity: 0.35; }
</style>
</head>
<body>
<div id="bgwrap"></div>
<div id="dim"></div>
<div id="dash"></div>
<div id="scan"></div>
<div id="empty">waiting for stats</div>
<script>
// ---------------- tweak me ----------------
const CONFIG = {
  // tiles
  tileCpu: true, tileGpu: true, tileMem: true, tileNet: true, tileDisk: true, tileBat: true, tileTop: false, tileSys: true, topRows: 6, topSort: 'cpu',
  // layout
  layout: 'grid',            // grid | sidebar-left | sidebar-right | bar-top | bar-bottom | corner
  corner: 'top-right', columns: 3, scale: 1, margin: 56,
  // look
  style: 'glass',            // glass | flat | outline | terminal
  scanlines: true, accent: '#d97757', fg: '#eef1f6', panelOpacity: 0.35, radius: 18, font: 'system', showTitles: true,
  graphSeconds: '120', dim: 0.2,
  // background
  bg: 'aurora', bgColors: ['#04070e', '#0c1d40', '#12707f', '#6cc3e0'], bgSpeed: 1, bgIntensity: 1, bgScale: 0.5,
  // alerts (percent, 0 = off)
  alertCpu: 85, alertMem: 90,
  fps: 30,
};
const FONTS = { system: '-apple-system, "Helvetica Neue", sans-serif', rounded: 'ui-rounded, "SF Pro Rounded", -apple-system, sans-serif',
                mono: 'ui-monospace, "SF Mono", Menlo, monospace', serif: 'ui-serif, "New York", Georgia, serif',
                avenir: '"Avenir Next", "Helvetica Neue", sans-serif', futura: 'Futura, "Avenir Next", "Helvetica Neue", sans-serif',
                menlo: 'Menlo, ui-monospace, monospace' };
const SCHEMA = { stats: true, groups: [
  { label: 'Tiles', fields: [
    { key: 'tileCpu', type: 'toggle', label: 'CPU' }, { key: 'tileGpu', type: 'toggle', label: 'GPU' },
    { key: 'tileMem', type: 'toggle', label: 'Memory' }, { key: 'tileNet', type: 'toggle', label: 'Network' },
    { key: 'tileDisk', type: 'toggle', label: 'Disk' }, { key: 'tileBat', type: 'toggle', label: 'Battery' },
    { key: 'tileTop', type: 'toggle', label: 'Top processes' },
    { key: 'topRows', type: 'range', label: 'Process rows', min: 5, max: 8, step: 1, showIf: { key: 'tileTop', is: true } },
    { key: 'topSort', type: 'select', label: 'Rank by', options: [{ value: 'cpu', label: 'CPU' }, { value: 'mem', label: 'Memory' }, { value: 'app', label: 'Memory, helpers folded into their app' }], showIf: { key: 'tileTop', is: true } },
    { key: 'tileSys', type: 'toggle', label: 'System' },
    { key: 'noteTiles', type: 'note', label: 'GPU and Battery hide themselves when this Mac has no reading for them.' },
  ]},
  { label: 'Layout', fields: [
    { key: 'layout', type: 'select', label: 'Layout', options: [
      { value: 'grid', label: 'Grid (centered)' }, { value: 'sidebar-left', label: 'Sidebar left' }, { value: 'sidebar-right', label: 'Sidebar right' },
      { value: 'bar-top', label: 'Bar along the top' }, { value: 'bar-bottom', label: 'Bar along the bottom' }, { value: 'corner', label: 'Corner cluster' } ] },
    { key: 'corner', type: 'select', label: 'Corner', showIf: { key: 'layout', is: 'corner' }, options: [
      { value: 'top-left', label: 'Top left' }, { value: 'top-right', label: 'Top right' },
      { value: 'bottom-left', label: 'Bottom left' }, { value: 'bottom-right', label: 'Bottom right' } ] },
    { key: 'columns', type: 'range', label: 'Columns', min: 1, max: 5, step: 1, showIf: { key: 'layout', is: 'grid' } },
    { key: 'scale', type: 'range', label: 'Tile scale', min: 0.5, max: 2, step: 0.05 },
    { key: 'margin', type: 'range', label: 'Margin', min: 0, max: 240, step: 4 },
  ]},
  { label: 'Look', fields: [
    { key: 'style', type: 'select', label: 'Style', options: [
      { value: 'glass', label: 'Glass' }, { value: 'flat', label: 'Flat' }, { value: 'outline', label: 'Outline' }, { value: 'terminal', label: 'Terminal' } ] },
    { key: 'scanlines', type: 'toggle', label: 'Scanlines', showIf: { key: 'style', is: 'terminal' } },
    { key: 'noteTerm', type: 'note', label: 'Terminal looks best with a green (#33ff66) or amber (#ffb000) accent.', showIf: { key: 'style', is: 'terminal' } },
    { key: 'font', type: 'select', label: 'Font', options: [
      { value: 'system', label: 'System' }, { value: 'rounded', label: 'Rounded' }, { value: 'mono', label: 'Monospace' }, { value: 'serif', label: 'Serif' },
      { value: 'avenir', label: 'Avenir Next' }, { value: 'futura', label: 'Futura' }, { value: 'menlo', label: 'Menlo' } ] },
    { key: 'panelOpacity', type: 'range', label: 'Panel opacity', min: 0, max: 1, step: 0.05 },
    { key: 'radius', type: 'range', label: 'Corner radius', min: 0, max: 40, step: 1 },
    { key: 'showTitles', type: 'toggle', label: 'Tile titles' },
    { key: 'graphSeconds', type: 'select', label: 'Graph history', options: [
      { value: '60', label: '1 minute' }, { value: '120', label: '2 minutes' }, { value: '300', label: '5 minutes' } ] },
    { key: 'dim', type: 'range', label: 'Darken background', min: 0, max: 0.8, step: 0.05 },
  ]},
  { label: 'Colors', fields: [
    { key: 'accent', type: 'color', label: 'Accent' }, { key: 'fg', type: 'color', label: 'Text' },
    { key: 'bgColors', type: 'colors', label: 'Background palette' },
  ]},
  { label: 'Background', fields: [
    { key: 'bg', type: 'select', label: 'Animation', options: [{ value: 'none', label: 'None (black)' }].concat(BG.list.filter(b => b.id !== 'none').map(b => ({ value: b.id, label: b.label }))) },
    { key: 'bgSpeed', type: 'range', label: 'Speed', min: 0, max: 3, step: 0.05 },
    { key: 'bgIntensity', type: 'range', label: 'Intensity', min: 0, max: 2, step: 0.05 },
  ]},
  { label: 'Alerts', fields: [
    { key: 'alertCpu', type: 'range', label: 'CPU above (%)', min: 0, max: 100, step: 5 },
    { key: 'alertMem', type: 'range', label: 'Memory above (%)', min: 0, max: 100, step: 5 },
    { key: 'noteAlert', type: 'note', label: '0 turns an alert off. A serious or critical thermal state always shows a badge on the CPU tile.' },
  ]},
  { label: 'Performance', fields: [
    { key: 'bgScale', type: 'range', label: 'Background render scale', min: 0.2, max: 1, step: 0.05 },
    { key: 'fps', type: 'range', label: 'Background frame rate', min: 5, max: 60, step: 1 },
  ]},
]};
const REBUILD = new Set(['layout', 'corner', 'columns', 'tileCpu', 'tileGpu', 'tileMem', 'tileNet', 'tileDisk', 'tileBat', 'tileTop', 'tileSys', 'topRows', 'topSort']);
// The process list the Top tile ranks by (CONFIG.topSort): by CPU, by memory, or apps with their helpers summed.
function topList(s) {
  const m = CONFIG.topSort === 'mem' ? s.topMem : CONFIG.topSort === 'app' ? s.topApps : null;
  const list = (m && m.length ? m : (s.top || [])).slice();
  const byMem = CONFIG.topSort !== 'cpu' && m && m.length;
  return { list: list.sort((a, b) => byMem ? (b.mem || 0) - (a.mem || 0) : (b.cpu || 0) - (a.cpu || 0)), byMem };
}
LTW.setup(CONFIG, SCHEMA, {
  change(k, v) {
    if (k === 'bg') buildBackground();
    else if (k === 'bgColors') { bg && bg.setColors(CONFIG.bgColors); }
    else if (k === 'bgIntensity') { bgOpts.intensity = v; if (bg && ['dust', 'bokeh', 'stars', 'mesh'].includes(CONFIG.bg)) bg.resize(); }
    else if (k === 'bgSpeed') bgOpts.speed = v;
    else if (k === 'bgScale') { bgOpts.scale = v; bg && bg.resize(); }
    applyLook();
    if (REBUILD.has(k)) buildDash(); else { fitToScreen(); render(); }
  },
  stats(sample) { goReal(); feed(sample); },
});
// ------------------------------------------
const dash = document.getElementById('dash');
const isCompact = () => CONFIG.layout === 'corner' || CONFIG.layout.startsWith('bar');
const isNarrow = () => CONFIG.layout !== 'grid' || CONFIG.columns < 2;

function applyLook() {
  const r = document.documentElement.style;
  r.setProperty('--fg', CONFIG.fg); r.setProperty('--accent', CONFIG.accent);

      setText(t.querySelector('.state'), S.charging ? '⚡︎ charging' : S.pluggedIn ? 'on power' : 'on battery');
      setText(t.querySelector('.tlab'), S.charging ? 'To full' : 'Time left');
      setText(t.querySelector('.time'), S.timeRemaining == null ? (S.pluggedIn && !S.charging ? 'Charged' : 'Calculating') : fmtMin(S.timeRemaining));
      setText(t.querySelector('.watts'), V.watts == null ? '—' : (V.watts > 0 ? '+' : V.watts < 0 ? '−' : '') + Math.abs(V.watts).toFixed(1) + ' W');
      setText(t.querySelector('.health'), S.health == null ? '—' : pct(S.health)); setText(t.querySelector('.cycles'), S.cycles == null ? '—' : String(S.cycles));
      setText(t.querySelector('.temp'), V.batteryTemp == null ? '—' : V.batteryTemp.toFixed(0) + ' °C');
    },
    cbuild(t) { t.innerHTML = `<div class="battglyph"><i></i></div><div class="txt"><div class="lab">Battery</div><div class="val">—</div></div>`; },
    cdraw(t) {
      const g = t.querySelector('.battglyph i'); setW(g, V.battery); g.style.background = S.charging ? 'var(--good)' : V.battery < 0.2 ? 'var(--warn)' : '';
      t.querySelector('.val').innerHTML = `${pct(V.battery)}${S.charging ? ' ⚡︎' : ''} <small>${S.timeRemaining == null ? (S.pluggedIn ? 'on power' : '') : fmtMin(S.timeRemaining) + (S.charging ? ' to full' : ' left')}</small>`;
    } },

  { key: 'tileTop', id: 'top', visible: s => topList(s).list.length > 0,
    build(t) {
      const n = Math.max(1, Math.round(CONFIG.topRows) || 6);
      const sub = CONFIG.topSort === 'app' ? 'by app · memory' : CONFIG.topSort === 'mem' ? 'memory · cpu' : 'cpu · memory';
      t.innerHTML = title(CONFIG.topSort === 'app' ? 'Top apps' : 'Top processes', `<span class="xs">${sub}</span>`) + `<div class="plist">${'<div class="prow"><span class="pn"></span><div class="bar"><i></i></div><span class="pc"></span><span class="pm"></span></div>'.repeat(n)}</div>`;
    },
    draw(t) {
      const rows = t.querySelectorAll('.prow'), { list, byMem } = topList(S);
      const cpuOf = p => (p.pid != null && V.top[p.pid] != null) ? V.top[p.pid] : (p.cpu || 0);
      const scale = Math.max(byMem ? 1e6 : 1, list[0] ? (byMem ? list[0].mem : cpuOf(list[0])) : 1);
      rows.forEach((row, i) => {
        const p = list[i]; row.style.visibility = p ? '' : 'hidden'; if (!p) return;
        const name = (p.name || String(p.pid)) + (p.count > 1 ? ' ×' + p.count : '');
        setText(row.querySelector('.pn'), name); setW(row.querySelector('.bar i'), (byMem ? p.mem : cpuOf(p)) / scale);
        setText(row.querySelector('.pc'), byMem ? fmtB(p.mem) : pct(cpuOf(p))); setText(row.querySelector('.pm'), byMem ? pct(cpuOf(p)) : fmtB(p.mem));
      });
    },
    cbuild(t) { t.innerHTML = `<div class="txt"><div class="lab">Top</div><div class="val">—</div></div>`; },
    cdraw(t) {
      const { list, byMem } = topList(S);
      const cpuOf = p => (p.pid != null && V.top[p.pid] != null) ? V.top[p.pid] : (p.cpu || 0);
      t.querySelector('.val').innerHTML = list.slice(0, 2).map(p => `${p.name}${p.count > 1 ? ' ×' + p.count : ''} <small>${byMem ? fmtB(p.mem) : pct(cpuOf(p))}</small>`).join(' <span class="arrow">·</span> ') || '—';
    } },

  { key: 'tileSys', id: 'sys', visible: () => true,
    build(t) {

        `<div class="kv rows fill"><div><span class="xs">Uptime</span><span class="mid up">—</span></div><div><span class="xs">Processes</span><span class="mid procs">—</span></div>` +
        `<div><span class="xs">Load</span><span class="mid load">—</span></div><div><span class="xs">Thermal</span><span class="mid therm">—</span></div>` +
        `<div><span class="xs">Wallpaper</span><span class="mid self">—</span></div></div>`;
    },
    draw(t) {

      setText(t.querySelector('.load'), (S.loadAvg || []).length ? S.loadAvg.map(v => v.toFixed(2)).join('  ') : '—');
      const th = t.querySelector('.therm'); th.className = 'mid therm ' + (S.thermal === 'critical' ? 'warn' : S.thermal === 'serious' ? 'amber' : S.thermal === 'fair' ? '' : 'good');
      setText(th, cap(S.thermal));
      setText(t.querySelector('.self'), V.selfCpu == null ? '—' : (V.selfCpu * 100).toFixed(1) + '% · ' + fmtB(V.selfMem));
    },
    cbuild(t) { t.innerHTML = `<div class="txt"><div class="lab">System</div><div class="val">—</div></div>`; },
    cdraw(t) {
      t.querySelector('.val').innerHTML = `${fmtUp(S.uptime)} <small>up</small> <span class="arrow">·</span> ${S.processes == null ? '—' : S.processes} <small>procs</small> <span class="arrow">·</span> <span class="${S.thermal === 'critical' ? 'warn' : S.thermal === 'serious' ? 'amber' : ''}">${cap(S.thermal)}</span>`;
    } },
];
const visSig = () => S ? TILES.map(t => (CONFIG[t.key] && t.visible(S)) ? 1 : 0).join('') : '';
let built = [];
function buildDash() {
  dash.innerHTML = ''; built = [];
  if (!S) return;
  builtSig = visSig();
  const compact = isCompact(), narrow = isNarrow();
  const tiles = document.createElement('div'); tiles.className = 'tiles' + (compact ? ' panel' : '');
  for (const def of TILES) {
    if (!CONFIG[def.key] || !def.visible(S)) continue;
    const t = document.createElement('div');
    t.className = compact ? 'chip ' + def.id : 'tile panel ' + def.id + (def.id === 'cpu' && !narrow ? ' wide' : '');
    if (compact) def.cbuild(t); else def.build(t, narrow);
    tiles.appendChild(t); built.push({ def, t });
  }
  dash.appendChild(tiles);

  fitToScreen(); startTween(); render();
}
function render() {
  if (!S || !V || !built.length) return;
  U = parseFloat(getComputedStyle(dash).fontSize) || 19;
  const compact = isCompact();
  for (const { def, t } of built) { try { compact ? def.cdraw(t) : def.draw(t); } catch (e) { console.error(def.id, e); } }
}

// ---------- demo feed (plain browser, or before the app's first sample) ----------
let gotReal = false, demoTimer = 0, demoPrev = null;
const walk = (v, step, lo, hi, home) => { if (home != null) v += (home - v) * 0.12; return Math.min(hi, Math.max(lo, v + (Math.random() - 0.5) * step)); };
const NAMES = ['WindowServer', 'Safari', 'Xcode', 'kernel_task', 'Code Helper (Renderer)', 'Spotify', 'Final Cut Pro', 'Terminal', 'Slack Helper', 'Music'];
function demoSample(p) {
  let cpu = p ? walk(p.cpu, 0.14, 0.05, 0.92, 0.3) : 0.27; if (Math.random() < 0.05) cpu = Math.min(0.95, cpu + 0.3);
  const cores = Array.from({ length: 10 }, (_, i) => clamp01(cpu * (i < 4 ? 1.35 : 0.75) * (0.55 + Math.random() * 0.9)));
  const memTotal = 32e9, memUsed = p ? walk(p.memUsed, 0.6e9, 9e9, 29e9) : 17.4e9;
  const memWired = 3.1e9, memCompressed = Math.max(0, (memUsed - 12e9) * 0.25), memApp = memUsed - memWired - memCompressed, memCached = 4.2e9;
  const battery = p ? Math.max(0.05, p.battery - 0.00035) : 0.82;
  const netIn = p ? (Math.random() < 0.12 ? walk(p.netIn, 24e6, 0, 60e6) : walk(p.netIn, 1.2e6, 20e3, 60e6, 1.5e6)) : 1.4e6;
  const netOut = p ? walk(p.netOut, 0.6e6, 8e3, 12e6, 0.3e6) : 0.24e6;
  const diskRead = p ? (Math.random() < 0.2 ? walk(p.diskRead, 120e6, 0, 400e6) : p.diskRead * 0.6) : 12e6;
  const diskWrite = p ? (Math.random() < 0.25 ? walk(p.diskWrite, 40e6, 0, 150e6) : p.diskWrite * 0.6) : 3.1e6;
  const top = NAMES.map((name, i) => {
    const prev = p && p.top.find(q => q.pid === 100 + i);
    return { pid: 100 + i, name, cpu: prev ? walk(prev.cpu, 0.3, 0.005, i === 1 ? 2.4 : 1.1) : [0.42, 0.78, 0.31, 0.12, 0.26, 0.08, 0.6, 0.03, 0.09, 0.05][i], mem: [0.9e9, 1.6e9, 2.8e9, 0.6e9, 0.8e9, 0.4e9, 3.4e9, 0.07e9, 0.5e9, 0.3e9][i] };
  }).sort((a, b) => b.cpu - a.cpu).slice(0, 8);
  return {
    cpu, cpuUser: cpu * 0.68, cpuSystem: cpu * 0.32, cores, loadAvg: [cpu * 10 * 0.8, cpu * 10 * 0.7, cpu * 10 * 0.6],
    memUsed, memTotal, memApp, memWired, memCompressed, memCached, swapUsed: p ? walk(p.swapUsed, 0.1e9, 0, 2e9) : 1.1e9, swapTotal: 2e9,
    battery, charging: false, pluggedIn: false, timeRemaining: Math.round(battery * 310), cycles: 312, health: 0.91,
    watts: p ? walk(p.watts, 1.5, -14, -5) : -8.4, batteryTemp: p ? walk(p.batteryTemp, 0.4, 28, 36) : 31.2,
    gpu: p ? walk(p.gpu, 0.12, 0.02, 0.9, 0.25) : 0.21,
    diskRead, diskWrite, diskFree: 412.6e9, diskTotal: 994.7e9,
    netIn, netOut, netTotalIn: (p ? p.netTotalIn : 48.2e9) + netIn * 2, netTotalOut: (p ? p.netTotalOut : 12.1e9) + netOut * 2, netInterface: 'en0',
    thermal: cpu > 0.88 ? 'serious' : cpu > 0.75 ? 'fair' : 'nominal', uptime: (p ? p.uptime : 3 * 86400 + 4 * 3600 + 12 * 60) + 2, processes: 480 + Math.round(Math.random() * 6),
    self: { cpu: 0.008 + Math.random() * 0.012, mem: 92e6 }, top,
    topMem: top.slice().sort((a, b) => b.mem - a.mem),
    topApps: [['Final Cut Pro', 3.4e9, 2], ['Xcode', 2.8e9, 5], ['Safari', 1.6e9, 9], ['Code', 0.8e9, 6], ['kernel_task', 0.6e9, 1], ['Spotify', 0.4e9, 3]].map(([name, mem, count]) => ({ name, mem, cpu: 0.02 + Math.random() * 0.4, count })),
  };
}
function startDemo() {
  if (demoTimer || gotReal) return;
  const now = performance.now(), N = 90;   // prime the graphs with a backdated history so the preview is not empty
  for (let i = N; i > 0; i--) { demoPrev = demoSample(demoPrev); pushHist(demoPrev, now - i * 2000); }
  demoPrev = demoSample(demoPrev); feed(demoPrev);
  demoTimer = setInterval(() => {
    if (gotReal) { stopDemo(); return; }
    if (LTW.stats && LTW.stats !== S) { goReal(); feed(LTW.stats); return; }   // app feed exists but the hook never fired
    demoPrev = demoSample(demoPrev); feed(demoPrev);
  }, 2000);
}
function stopDemo() { if (demoTimer) { clearInterval(demoTimer); demoTimer = 0; } }
// First real sample: drop any demo history so the graphs only ever show real readings.
function goReal() {
  gotReal = true;
  if (demoTimer) { stopDemo(); for (const k in H) H[k].length = 0; V = null; S = null; }
}

applyLook(); buildBackground();
if (LTW.stats) { gotReal = true; feed(LTW.stats); }
else setTimeout(() => { if (!S && LTW.stats == null) startDemo(); else if (!S) { gotReal = true; feed(LTW.stats); } }, 2500);
setTimeout(() => { if (!S) document.getElementById('empty').style.display = 'flex'; }, 1500);
