<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Synthwave</title>
<script src="_ltw.js"></script>
<script src="_gl.js"></script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #120726; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ---------------- tweak me ----------------
const CONFIG = {
  sky: '#120726', horizon: '#ff3d81', sun: '#ffb347', sun2: '#ff2d95', grid: '#19e6ff', mountain: '#0a0418',
  sunSize: 0.32, gridSpeed: 0.6, glow: 0.8, scanlines: 0.25, stars: true,
  audio: true,          // bass pumps the sun and the grid glow
  resolution: 0.6, fps: 30,
};
const SCHEMA = { audio: true, pointer: true, groups: [
  { label: 'Colors', fields: [
    { key: 'sky', type: 'color', label: 'Sky' }, { key: 'horizon', type: 'color', label: 'Horizon' },
    { key: 'sun', type: 'color', label: 'Sun top' }, { key: 'sun2', type: 'color', label: 'Sun bottom' },
    { key: 'grid', type: 'color', label: 'Grid' }, { key: 'mountain', type: 'color', label: 'Mountains' },
  ]},
  { label: 'Look', fields: [
    { key: 'sunSize', type: 'range', label: 'Sun size', min: 0.1, max: 0.6, step: 0.01 },
    { key: 'glow', type: 'range', label: 'Glow', min: 0, max: 1.5, step: 0.05 },
    { key: 'scanlines', type: 'range', label: 'Scanlines', min: 0, max: 0.6, step: 0.05 },
    { key: 'stars', type: 'toggle', label: 'Stars' },
  ]},
  { label: 'Motion', fields: [
    { key: 'gridSpeed', type: 'range', label: 'Drive speed', min: 0, max: 2, step: 0.05 },
    { key: 'audio', type: 'toggle', label: 'React to music ♪' },
  ]},
  { label: 'Performance', fields: [
    { key: 'resolution', type: 'range', label: 'Render scale', min: 0.2, max: 1, step: 0.05 },
    { key: 'fps', type: 'range', label: 'Frame rate', min: 5, max: 60, step: 1 },
  ]},
]};
LTW.setup(CONFIG, SCHEMA, { change(k) { if (k === 'resolution') G.resize(CONFIG.resolution); else setUniforms(); } });
// ------------------------------------------
const FS = `
uniform float T, SZ, GL, SC, ST, B, M; uniform vec2 P;
uniform vec3 CSKY, CHOR, CSUN, CSUN2, CGRID, CMTN;
float h(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float n(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
  return mix(mix(h(i), h(i+vec2(1,0)), f.x), mix(h(i+vec2(0,1)), h(i+vec2(1,1)), f.x), f.y); }
void main(){
  vec2 uv = gl_FragCoord.xy / R; float asp = R.x / R.y;
  float hz = 0.42 + P.y * 0.02;                 // horizon height
  vec2 p = vec2((uv.x - 0.5) * asp - P.x * 0.03, uv.y - hz);
  vec3 col = CSKY;
  if (p.y > 0.0) {
    // sky gradient + stars
    col = mix(CHOR, CSKY, smoothstep(0.0, 0.55, p.y));
    if (ST > 0.5) {
      vec2 g = p * 40.0; vec2 id = floor(g); float r = h(id);
      float d = length(fract(g) - 0.5 - (vec2(h(id + 1.3), h(id + 2.9)) - 0.5) * 0.6);
      col += vec3(1.0) * smoothstep(0.06, 0.0, d) * step(0.93, r) * (0.5 + 0.5 * sin(T * 2.0 + r * 50.0)) * smoothstep(0.05, 0.3, p.y);
    }
    // sun with horizontal stripes, pumping with the bass
    float sz = SZ * (1.0 + B * 0.12);
    vec2 sp = p - vec2(0.0, sz * 0.75);
    float d = length(sp);
    float stripes = smoothstep(0.0, 0.015, abs(fract((sp.y + sz) / sz * 4.0 - T * 0.3) - 0.5) - 0.12 - 0.25 * smoothstep(sz * 0.3, -sz, sp.y));
    float sunMask = smoothstep(sz, sz - 0.004, d) * stripes;
    vec3 sunCol = mix(CSUN2, CSUN, smoothstep(-sz, sz, sp.y));
    col = mix(col, sunCol, sunMask);
    col += sunCol * GL * 0.35 * exp(-d * 4.0 / sz) * (1.0 + B * 0.5);
    // mountains: two ridges of layered noise
    float m1 = 0.10 + 0.09 * n(vec2(p.x * 3.0 + 10.0, 0.0)) + 0.04 * n(vec2(p.x * 9.0, 1.0));
    float m2 = 0.05 + 0.06 * n(vec2(p.x * 4.0 + 50.0, 0.0)) + 0.02 * n(vec2(p.x * 13.0, 3.0));
    col = mix(col, mix(CMTN, CHOR, 0.25), smoothstep(m1 + 0.004, m1, p.y));
    col = mix(col, CMTN, smoothstep(m2 + 0.003, m2, p.y));
    col = mix(col, CGRID, smoothstep(0.004, 0.0, abs(p.y - m1)) * 0.6 + smoothstep(0.003, 0.0, abs(p.y - m2)) * 0.8);
  } else {
    // perspective floor grid
    float z = 1.0 / (-p.y + 0.002);
    float x = p.x * z * 1.2;
    float zz = z * 0.7 + T * M;
    vec2 g = vec2(abs(fract(x) - 0.5), abs(fract(zz) - 0.5));
    float w = fwidth(x) * 1.2, wz = fwidth(zz) * 1.2;
    float line = max(smoothstep(0.5 - w * 1.5, 0.5 - w * 0.2, g.x), smoothstep(0.5 - wz * 1.5, 0.5 - wz * 0.2, g.y));
    float dd = -p.y;
    float fade = smoothstep(0.0, 0.05, dd) * (0.45 + 0.55 * smoothstep(0.0, 0.3, dd));
    vec3 floorCol = mix(CSKY * 0.6, CHOR * 0.35, fade);
    col = mix(floorCol, CGRID, line * fade * (0.6 + 0.4 * GL + B * 0.5));
    col += CGRID * 0.18 * GL * fade * (1.0 - min(1.0, -p.y * 4.0));
    col = mix(col, CHOR, smoothstep(0.015, 0.0, -p.y));   // horizon glow line
  }
  col *= 1.0 - SC * 0.5 * (0.5 + 0.5 * sin(gl_FragCoord.y * 3.14159 * 0.5 / (R.y / 540.0)));
  col *= 0.85 + 0.3 * (1.0 - length(uv - 0.5));
  gl_FragColor = vec4(col, 1.0);
}`;
const G = GL(document.getElementById('c'), FS);
function setUniforms() {
  G.color('CSKY', CONFIG.sky); G.color('CHOR', CONFIG.horizon); G.color('CSUN', CONFIG.sun); G.color('CSUN2', CONFIG.sun2);
  G.color('CGRID', CONFIG.grid); G.color('CMTN', CONFIG.mountain);
  G.uniform('SZ', CONFIG.sunSize); G.uniform('GL', CONFIG.glow); G.uniform('SC', CONFIG.scanlines); G.uniform('ST', CONFIG.stars ? 1 : 0);
}
setUniforms(); G.resize(CONFIG.resolution); addEventListener('resize', () => G.resize(CONFIG.resolution));
let t = 0, bass = 0, px = 0, py = 0;
LTWLoop(() => CONFIG.fps, (now, dt) => {
  LTW.audioTick(now);
  const target = CONFIG.audio ? LTW.audio.bass : 0;
  bass += (target - bass) * (target > bass ? 0.5 : 0.1);
  t += dt;
  px += (LTW.pointer.x - px) * 0.06; py += (LTW.pointer.y - py) * 0.06;
  G.uniform('T', t); G.uniform('M', CONFIG.gridSpeed * 2); G.uniform('B', bass); G.uniform('P', px, py); G.draw();
});
</script>
</body>
</html>
